[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bri-inference-pipeline"
version = "0.1.0"
description = "Real-time continuous sEMG finger joint kinematics inference pipeline and MuJoCo Shadow Hand visualization"
authors = [{ name = "ETH Robotics Club" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.1",
    "pyyaml>=6.0",
    "bleak>=0.21.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "pyriemann>=0.6",
    "mediapipe>=0.10",
    "opencv-python>=4.8",
    "mujoco>=3.0.0",
    "mujoco-menagerie @ git+https://github.com/scone/mujoco_menagerie_py.git",
    "mjviser @ git+https://github.com/scone/mjviser.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
